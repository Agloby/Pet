name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].values.flatten; phone = devices.find { |d| d["name"].start_with?("iPhone") && d["isAvailable"] }; abort "No iPhone simulator available" unless phone; print phone["udid"]')
          echo "KERN_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and test
        run: |
          set -o pipefail
          set +e
          xcodebuild test \
            -project Kern.xcodeproj \
            -scheme Kern \
            -destination "id=$KERN_SIMULATOR_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E 'error:|Testing failed:|BUILD FAILED' xcodebuild.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            diagnostics=$(grep -E -B 15 -A 15 'Simulator device failed|Failed to install|IXUserPresentableErrorDomain|ApplicationVerificationFailed' xcodebuild.log | tail -n 120 | tr '\n' ' ')
            if [ -n "$diagnostics" ]; then
              echo "::error title=Simulator install diagnostics::$diagnostics"
            fi
            exit "$status"
          fi

