name: Kern
options:
  bundleIdPrefix: com.agloby
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Kern:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/KernApp
      - path: ../desktop/assets/kern-hd.png
        buildPhase: resources
      - path: ../desktop/assets/reef-habitat.png
        buildPhase: resources
      - path: ../desktop/assets/reef-fish.png
        buildPhase: resources
      - path: ../desktop/assets/sea-turtle.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KERN_APP_BUNDLE_ID)
        PRODUCT_NAME: Kern
        CODE_SIGN_ENTITLEMENTS: Resources/Kern.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Resources/Kern-Info.plist
        SUPPORTS_MACCATALYST: false
    dependencies:
      - target: KernWidget
        embed: true
  KernWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/KernWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KERN_WIDGET_BUNDLE_ID)
        PRODUCT_NAME: KernWidget
        CODE_SIGN_ENTITLEMENTS: Resources/KernWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Resources/KernWidget-Info.plist
        SKIP_INSTALL: true
        SUPPORTS_MACCATALYST: false
  KernTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Kern
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agloby.kern.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Kern:
    build:
      targets:
        Kern: all
        KernWidget: all
        KernTests: [test]
    test:
      targets:
        - KernTests
      gatherCoverageData: true
