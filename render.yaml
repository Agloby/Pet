services:
  - type: web
    name: kern-reef-companion
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kern-postgres
          property: connectionString
      - key: KERN_SYNC_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000

databases:
  - name: kern-postgres
    databaseName: kern
    user: kern
    plan: free
    region: frankfurt
    ipAllowList: []
